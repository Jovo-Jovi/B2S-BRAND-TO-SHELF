name: docs-integrity

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Stated-count check (PR-15)
        run: python3 scripts/check_stated_counts.py

      - name: Ledger reconciliation
        run: python3 scripts/check_ledger.py

      - name: Credential pattern scan
        run: python3 scripts/check_credentials.py

      - name: Done-steps shape assertion
        run: python3 scripts/check_done_steps_shape.py

      - name: SESSION_CONTEXT heading-shape assertion (CF-123)
        run: python3 scripts/check_session_context_shape.py

      - name: Migration split fidelity (ADR-006, CF-110)
        run: python3 scripts/check_migration_split.py

      # OD-H9 — a reviewer-authored specification lands with the check that
      # asserts it against reality. These three are the static half; the
      # assertions that need the live database belong to the readiness task
      # (OD-H8) and to §11.5's re-derivation at each phase exit gate.
      - name: MODULE_SPEC §1 tree conformance (OD-H10, CF-115)
        run: python3 scripts/check_module_spec_tree.py

      - name: DATA_MODEL §3 against the authoritative schema
        run: python3 scripts/check_data_model_schema.py

      - name: SECURITY_MODEL §11a.1 bypass inventory against the schema (CF-132)
        run: python3 scripts/check_security_model_bypass.py
