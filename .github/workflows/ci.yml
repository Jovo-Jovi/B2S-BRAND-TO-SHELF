name: ci

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

env:
  NODE_VERSION: "24"

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache node_modules
        id: cache
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node_modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci

  lint:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node_modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          fail-on-cache-miss: true

      - name: Lint
        run: npm run lint

  typecheck:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node_modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          fail-on-cache-miss: true

      - name: Typecheck
        run: npm run typecheck

  unit:
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node_modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          fail-on-cache-miss: true

      - name: Unit tests
        run: npm test

  guards:
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node_modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          fail-on-cache-miss: true

      # All six guards have a live target. check-service-import stopped being
      # a vacuous pass at P01-T02: ADR-005's quarantine now exists at
      # lib/supabase/server-only/, and the guard fails if it ever disappears
      # rather than reporting OK for lack of anything to check (PR-21).
      # check-enum-keys joined them at P01-T05-FIX, when the P01 exit gate found
      # ARCHITECTURE §6's row unenforced against four live Postgres enums.
      # check-zod-coverage joined them at P02-T14 with the first
      # features/<module>/actions.ts (ADR-010).
      - name: check-no-runtime-cdn
        run: node scripts/check-no-runtime-cdn.mjs

      - name: check-no-hardcoded-literals
        run: node scripts/check-no-hardcoded-literals.mjs

      - name: check-service-import
        run: node scripts/check-service-import.mjs

      - name: check-data-boundary
        run: node scripts/check-data-boundary.mjs

      - name: check-enum-keys
        run: node scripts/check-enum-keys.mjs

      - name: check-zod-coverage
        run: node scripts/check-zod-coverage.mjs

  # ARCHITECTURE.md §5 — types are generated from the one Supabase environment
  # (ADR-012), and a diff between the generated types and the committed ones
  # fails the pipeline loudly, INCLUDING when the secret is absent. A job that
  # skips silently is worse than one that fails, because a green pipeline then
  # means "nobody looked" while reading as "the schema and the types agree".
  types-drift:
    needs: guards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node_modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          fail-on-cache-miss: true

      # This step is the whole point of the job. It runs before anything that
      # could be skipped, and it exits non-zero rather than warning.
      - name: Require the drift secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          missing=""
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            missing="$missing SUPABASE_ACCESS_TOKEN"
          fi
          if [ -z "$SUPABASE_PROJECT_ID" ]; then
            missing="$missing SUPABASE_PROJECT_ID"
          fi
          if [ -n "$missing" ]; then
            echo "FAIL: types-drift cannot run. Absent repository secret(s):$missing"
            echo "This job never skips. An absent secret is a failure, not a reason"
            echo "to pass — see ARCHITECTURE.md §5. Set the secret, or supersede the"
            echo "rule with an ADR. Do not add a conditional to this step."
            exit 1
          fi
          echo "OK: both drift secrets are present"

      - name: Regenerate types from the live schema
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          npx --yes supabase@2.111.0 gen types typescript \
            --project-id "$SUPABASE_PROJECT_ID" > types/database.ts

      - name: Fail on drift
        run: |
          if ! git diff --exit-code -- types/database.ts; then
            echo "FAIL: types/database.ts does not match the live schema."
            echo "It is generated output (ADR-002) and is never hand-edited."
            echo "Regenerate it and commit the result."
            exit 1
          fi
          echo "OK: generated types match the live schema"

  build:
    needs: types-drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node_modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          fail-on-cache-miss: true

      - name: Build
        run: npm run build
